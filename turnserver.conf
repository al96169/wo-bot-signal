# TURN server configuration
# Reference: https://github.com/coturn/coturn

# 监听端口
listening-port=3478

# 使用认证密钥模式（与 wo-bot-signal 的 turn.ts 一致）
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET

# 外部 IP（部署时替换为服务器公网 IP）
external-ip=REPLACE_WITH_PUBLIC_IP

# relay 端口范围
min-port=49152
max-port=65535

# 日志
log-file=/dev/stdout
simple-log

# 安全
no-multicast-peers
no-loopback-peers
fingerprint
